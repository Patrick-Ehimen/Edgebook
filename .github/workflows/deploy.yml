name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set rootDirectory=apps/web so Vercel reads apps/web/package.json (which has
      # "next") and apps/web/vercel.json (which has the "cd ../.." install/build cmds).
      - name: Configure Vercel project rootDirectory
        run: |
          curl -s -X PATCH \
            "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": "apps/web"}' | jq -r '.rootDirectory // .error.message // "ok"'

      # Upload the full repo source; Vercel builds it in their infra using
      # apps/web/vercel.json (framework=nextjs, installCommand, buildCommand).
      - name: Deploy to Vercel
        run: npx vercel@latest deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

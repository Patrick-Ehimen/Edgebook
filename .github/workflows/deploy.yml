name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Upload the full repo source to Vercel and let their servers build it.
      # The root vercel.json provides install/build/output settings.
      # VERCEL_PROJECT_ID and VERCEL_ORG_ID identify the project without needing vercel pull.
      - name: Deploy to Vercel
        run: npx vercel@latest deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Edgebook">
  <defs>
    <linearGradient id="ebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d68f"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ebg)"/>
  <!-- spine -->
  <rect x="14" y="14" width="6" height="36" rx="3" fill="#ffffff"/>
  <!-- top arm -->
  <rect x="14" y="14" width="22" height="6" rx="3" fill="#ffffff"/>
  <!-- middle arm (shorter) -->
  <rect x="14" y="29" width="16" height="6" rx="3" fill="#ffffff"/>
  <!-- bottom arm flowing into rising edge line -->
  <path d="M 17 47 H 36 Q 47 47 49 38 T 50 18"
        stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
